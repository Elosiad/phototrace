        const ratingLabel = document.createElement('div');
        ratingLabel.className = 'form-label';
        ratingLabel.textContent = '评级（影响排序）';
        section.appendChild(ratingLabel);

        const ratingRow = document.createElement('div');
        ratingRow.className = 'rating-row';
        for (let i = 1; i <= 5; i++) {
            const star = document.createElement('span');
            star.className = `star ${i <= proj.rating ? 'filled' : 'empty'}`;
            star.textContent = '★';
            const idx = i;
            star.onclick = () => {
                proj.rating = proj.rating === idx ? 0 : idx;
                commitAndRefresh(proj);
            };
            ratingRow.appendChild(star);
        }
        section.appendChild(ratingRow);

        // 活动名称
        const nameField = mkField('活动名称', 'text', proj.name, v => { proj.name = v; commitAndRefresh(proj); });
        section.appendChild(nameField);

        // 日期
        const dateField = mkField('拍摄日期', 'date', proj.date, v => { proj.date = v; commitAndRefresh(proj); });
        section.appendChild(dateField);

        // 场地
        const locField = mkField('场地', 'text', proj.location, v => { proj.location = v; commitAndRefresh(proj); });
        section.appendChild(locField);

        // 设备
        const eqField = mkField('设备', 'text', proj.equipment, v => { proj.equipment = v; commitAndRefresh(proj); });
        section.appendChild(eqField);

        // 备注
        const notesLabel = document.createElement('div');
        notesLabel.className = 'form-label';
        notesLabel.style.marginTop = '8px';
        notesLabel.textContent = '备注';
        section.appendChild(notesLabel);

        const notesEl = document.createElement('textarea');
        notesEl.className = 'form-input';
        notesEl.value = proj.notes || '';
        notesEl.placeholder = '备注信息...';
        notesEl.rows = 3;
        notesEl.oninput = () => { proj.notes = notesEl.value; };
        notesEl.onblur = () => commitAndRefresh(proj);
        section.appendChild(notesEl);
    }

    function mkField(label, type, value, onChange) {
        const field = document.createElement('div');
        field.className = 'form-field';
        field.style.marginTop = '8px';

        const lbl = document.createElement('div');
        lbl.className = 'form-label';
        lbl.textContent = label;

        const inp = document.createElement('input');
        inp.type = type;
        inp.className = 'form-input';
        inp.value = value || '';
        inp.oninput = () => onChange(inp.value);
        inp.onblur = () => onChange(inp.value);

        field.appendChild(lbl);
        field.appendChild(inp);
        return field;
    }

    /* ===== 团体管理弹窗 ===== */
    function showGroupManager(proj) {
        // 使用 confirm 对话框区域展示团体管理
        const content = document.createElement('div');
        // 简化：在详情面板内展示
        showToast('请在人物任务区域添加团体分组', 'info');
        // TODO: 完整团体管理弹窗（添加/删除/编辑评级）
        openGroupManagerDialog(proj);
    }

    function openGroupManagerDialog(proj) {
        const backdrop = document.getElementById('confirmBackdrop');
        const titleEl = document.getElementById('confirmTitle');
        const msgEl = document.getElementById('confirmMessage');
        const okBtn = document.getElementById('btnConfirmOk');
        const cancelBtn = document.getElementById('btnConfirmCancel');

        titleEl.textContent = '管理团体分组';
        msgEl.innerHTML = '';

        const groups = proj.groups || [];
        const listEl = document.createElement('div');
        listEl.style.marginBottom = '12px';

        const renderGroupList = () => {
            listEl.innerHTML = '';
            if (groups.length === 0) {
                listEl.innerHTML = '<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">暂无团体</div>';
            }
            groups.forEach((g, idx) => {
                const row = document.createElement('div');
                row.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:6px;';

                const nameInp = document.createElement('input');
                nameInp.type = 'text';
                nameInp.className = 'form-input';
                nameInp.style.flex = '1';
                nameInp.style.padding = '5px 8px';
                nameInp.style.fontSize = '12px';
                nameInp.value = g.name;
                nameInp.oninput = () => { g.name = nameInp.value; };

                const rateInp = document.createElement('input');
                rateInp.type = 'number';
                rateInp.className = 'form-input';
                rateInp.style.width = '60px';
                rateInp.style.padding = '5px 8px';
                rateInp.style.fontSize = '12px';
                rateInp.min = '0';
                rateInp.max = '5';
                rateInp.placeholder = '评级';
                rateInp.value = g.rating || '';
                rateInp.oninput = () => { g.rating = parseInt(rateInp.value) || 0; };

                const delBtn = document.createElement('button');
                delBtn.className = 'btn danger';
                delBtn.style.cssText = 'font-size:11px;padding:4px 8px;';
                delBtn.textContent = '删除';
                delBtn.onclick = () => {
                    groups.splice(idx, 1);
                    // 清空该团体下的任务团体绑定
                    appData.personTasks.filter(t => t.projectId === proj.id && t.groupId === g.id)
                        .forEach(t => { t.groupId = null; });
                    renderGroupList();
                };

                row.appendChild(nameInp);
                row.appendChild(rateInp);
                row.appendChild(delBtn);
                listEl.appendChild(row);
            });
        };
        renderGroupList();

        const addRow = document.createElement('div');
        addRow.style.cssText = 'display:flex;gap:8px;';
        const newNameInp = document.createElement('input');
        newNameInp.type = 'text';
        newNameInp.className = 'form-input';
        newNameInp.style.cssText = 'flex:1;padding:5px 8px;font-size:12px;';
        newNameInp.placeholder = '新团体名称';
        const addBtn = document.createElement('button');
        addBtn.className = 'btn primary';
        addBtn.style.cssText = 'font-size:11px;padding:4px 10px;';
        addBtn.textContent = '添加团体';
        addBtn.onclick = () => {
            const name = newNameInp.value.trim();
            if (!name) return;
            groups.push(emptyGroup({ name }));
            proj.groups = groups;
            newNameInp.value = '';
            renderGroupList();
        };
        addRow.appendChild(newNameInp);
        addRow.appendChild(addBtn);

        msgEl.appendChild(listEl);
        msgEl.appendChild(addRow);

        okBtn.textContent = '保存团体';
        cancelBtn.textContent = '取消';
        confirmCallback = () => {
            proj.groups = groups;
            commitAndRefresh(proj);
        };
        backdrop.classList.add('active');
    }

    /* ===== 添加人物到项目 ===== */
    function addPersonToProject(proj, name, groupId) {
        // 查找已有同名人物，或新建
        let person = appData.persons.find(p => p.name === name);
        if (!person) {
            person = emptyPerson({ name });
            appData.persons.push(person);
        }

        // 同一项目+同一人物只建一个任务
        const existing = appData.personTasks.find(t => t.projectId === proj.id && t.personId === person.id && !t.excluded);
        if (existing) {
            showToast(`${name} 已在此项目中`, 'warning');
            return;
        }

        // 如果存在被排除的任务，恢复它
        const excludedTask = appData.personTasks.find(t => t.projectId === proj.id && t.personId === person.id && t.excluded);
        if (excludedTask) {
            excludedTask.excluded = false;
            excludedTask.groupId = groupId;
            showToast(`已恢复 ${name} 的任务`, 'success');
        } else {
            const task = emptyPersonTask({ projectId: proj.id, personId: person.id, groupId });
            appData.personTasks.push(task);
        }

        commitAndRefresh(proj);
    }

    /* ===== 人物任务详情 ===== */
    function openPersonTaskDetail(task, proj) {
        const person = getPersonById(task.personId);
        const panel = document.getElementById('personDetailPanel');

        document.getElementById('personDetailName').textContent = person ? person.name : '未知人物';
        document.getElementById('personDetailProject').textContent = proj.name + ' · ' + formatDate(proj.date);

        const body = document.getElementById('personDetailBody');
        body.innerHTML = '';

        // 人物改名
        const nameField = mkField('人物姓名', 'text', person ? person.name : '', v => {
            if (person) person.name = v;
        });
        body.appendChild(nameField);

        // 修图完成
        const editToggle = buildToggle('修图完成', task.editDone, (v) => {
            if (v) {
                task.editDone = true;
            } else {
                if (task.publishDone) {
                    task.publishDone = false;
                }
                task.editDone = false;
            }
            commitAndRefresh(proj);
            renderPanelContent(proj.id);
        });
        body.appendChild(editToggle);

        // 发布完成
        const pubToggle = buildToggle('发布完成', task.publishDone, (v) => {
            if (v && !task.editDone) { showToast('请先完成修图', 'warning'); return; }
            task.publishDone = v;
            commitAndRefresh(proj);
            renderPanelContent(proj.id);
        });
        body.appendChild(pubToggle);

        // 发布链接
        const linkLabel = document.createElement('div');
        linkLabel.className = 'form-label';
        linkLabel.style.marginTop = '10px';
        linkLabel.textContent = '发布链接';
        body.appendChild(linkLabel);

        const linkRow = document.createElement('div');
        linkRow.className = 'publish-link-row';
        const linkInp = document.createElement('input');
        linkInp.type = 'text';
        linkInp.className = 'form-input publish-link-input';
        linkInp.placeholder = 'https://...';
        linkInp.value = task.publishLink || '';
        linkInp.oninput = () => { task.publishLink = linkInp.value; };
        linkInp.onblur = () => { saveData(); };
        linkRow.appendChild(linkInp);
        body.appendChild(linkRow);

        // 精修导出数
        const expField = mkField('精修导出数', 'number', task.exportCount != null ? String(task.exportCount) : '', v => {
            task.exportCount = v !== '' ? parseInt(v) : null;
            saveData();
        });
        body.appendChild(expField);

        // 不再处理
        const divider = document.createElement('div');
        divider.className = 'divider';
        body.appendChild(divider);

        const excludeBtn = document.createElement('button');
        excludeBtn.className = `btn ${task.excluded ? 'success' : 'warning'}`;
        excludeBtn.textContent = task.excluded ? '↩ 恢复处理' : '🚫 标记不再处理';
        excludeBtn.onclick = () => {
            task.excluded = !task.excluded;
            commitAndRefresh(proj);
            closePersonDetail();
        };
        body.appendChild(excludeBtn);

        // 居中定位
        panel.style.cssText = `
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 520;
        `;
        panel.classList.add('active');
    }

    function closePersonDetail() {
        document.getElementById('personDetailPanel').classList.remove('active');
    }

    document.getElementById('btnClosePersonDetail').addEventListener('click', closePersonDetail);

    /* ===== 提交并刷新 ===== */
    function commitAndRefresh(proj) {
        const ok = saveData();
        if (!ok) {
            showToast('⚠ 保存失败，数据未写入', 'error');
            return;
        }
        renderPanelContent(proj.id);
        if (currentView === 'person') renderPersonView();
        else renderBoard();
    }

    /* ===========================================================
     * 10. 人物视图
     * =========================================================== */
    function renderPersonView() {
        const board = document.getElementById('personBoard');
        board.innerHTML = '';

        const query = (document.getElementById('personSearch').value || '').toLowerCase().trim();

        const personCols = [
            { id: 'pending_edit', label: '待修图', dotColor: '#6366f1' },
            { id: 'pending_pub',  label: '待发布', dotColor: '#10b981' },
            { id: 'published',    label: '已发布', dotColor: '#f59e0b' },
        ];

        // 分组：有效任务（未被排除、项目不在重新初筛中）
        const tasksByStatus = { pending_edit: [], pending_pub: [], published: [] };

        appData.personTasks.forEach(task => {
            if (task.excluded) return;
            const proj = getProjectById(task.projectId);
            if (!proj || proj.reScreening) return;
            if (!proj.screeningConfirmed) return;

            const person = getPersonById(task.personId);
            if (!person) return;

            // 搜索过滤
            if (query && !person.name.toLowerCase().includes(query) && !proj.name.toLowerCase().includes(query)) return;

            let col;
            if (task.publishDone) col = 'published';
            else if (task.editDone) col = 'pending_pub';
            else col = 'pending_edit';

            tasksByStatus[col].push({ task, person, proj });
        });

        personCols.forEach(col => {
            const items = tasksByStatus[col.id];

            const colEl = document.createElement('div');
            colEl.className = 'person-column';

            colEl.innerHTML = `
                <div class="column-header">
                    <div class="column-title">
                        <div class="column-dot" style="background:${col.dotColor}"></div>
                        ${col.label}
                    </div>
                    <div class="column-count">${items.length}</div>
                </div>
                <div class="column-body" id="person-col-${col.id}"></div>
            `;

            const colBody = colEl.querySelector(`#person-col-${col.id}`);

            if (items.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'no-data-column';
                empty.textContent = '暂无记录';
                colBody.appendChild(empty);
            } else {
                // 按项目日期排序
                items.sort((a, b) => (b.proj.date || '').localeCompare(a.proj.date || ''));
                items.forEach(({ task, person, proj }) => {
                    const card = document.createElement('div');
                    card.className = 'person-card';
                    card.innerHTML = `
                        <div class="person-card-name">${escHtml(person.name)}</div>
                        <div class="person-card-project">${escHtml(proj.name)} · ${formatDate(proj.date)}</div>
                    `;
                    card.addEventListener('click', () => {
                        // 跳转到项目详情
                        switchView('project');
                        setTimeout(() => openProjectDetail(proj.id), 100);
                    });
                    colBody.appendChild(card);
                });
            }

            board.appendChild(colEl);
        });
    }

    /* ===========================================================
     * 11. 新建项目
     * =========================================================== */
    function openNewProjectPanel() {
        const proj = emptyProject();
        appData.projects.push(proj);
        saveData();
        renderBoard();
        openProjectDetail(proj.id);
    }

    document.getElementById('btnAddProject').addEventListener('click', openNewProjectPanel);

    /* ===========================================================
     * 12. JSON 备份与恢复
     * =========================================================== */
    document.getElementById('btnExport').addEventListener('click', () => {
        const payload = {
            format: FORMAT_TAG,
            schemaVersion: SCHEMA_VERSION,
            exportedAt: new Date().toISOString(),
            projects: appData.projects,
            persons: appData.persons,
            personTasks: appData.personTasks,
            settings: appData.settings
        };
        const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(payload, null, 2));
        const a = document.createElement('a');
        a.href = dataStr;
        const dateStr = new Date().toISOString().slice(0, 10);
        a.download = `phototrace-backup-${dateStr}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast('已导出备份文件', 'success');
    });

    document.getElementById('btnImport').addEventListener('click', () => {
        document.getElementById('importFileInput').click();
    });

    document.getElementById('importFileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            try {
                const parsed = JSON.parse(evt.target.result);
                validateAndRestoreBackup(parsed);
            } catch (err) {
                showToast('文件解析失败，请确认是有效的 JSON 文件', 'error');
            }
        };
        reader.readAsText(file);
        e.target.value = '';
    });

    function validateAndRestoreBackup(data) {
        // 1. 格式校验
        if (!data || data.format !== FORMAT_TAG) {
            showToast('格式不正确，拒绝恢复（format 字段不匹配）', 'error');
            return;
        }
        if (data.schemaVersion === undefined || data.schemaVersion > SCHEMA_VERSION) {
            showToast(`未知版本（v${data.schemaVersion}），拒绝恢复`, 'error');
            return;
        }
        if (!Array.isArray(data.projects) || !Array.isArray(data.persons) || !Array.isArray(data.personTasks)) {
            showToast('备份文件字段不完整，拒绝恢复', 'error');
            return;
        }

        // 2. ID 关联完整性校验
        const personIdSet = new Set(data.persons.map(p => p.id));
        const projectIdSet = new Set(data.projects.map(p => p.id));
        const brokenTasks = data.personTasks.filter(t => !personIdSet.has(t.personId) || !projectIdSet.has(t.projectId));
        if (brokenTasks.length > 0) {
            showToast(`发现 ${brokenTasks.length} 条任务关联断裂，拒绝恢复`, 'error');
            return;
        }

        // 3. 预览
        const projCount = data.projects.length;
        const personCount = data.persons.length;
        const taskCount = data.personTasks.length;
        const exportedAt = data.exportedAt ? new Date(data.exportedAt).toLocaleString() : '未知时间';

        showConfirm(
            '恢复备份',
            `备份时间：${exportedAt}\n` +
            `包含：${projCount} 个项目、${personCount} 位人物、${taskCount} 条任务\n\n` +
            `⚠ 恢复将完整替换当前所有数据，替换前会保存快照。\n确认继续？`,
            () => restoreBackup(data),
            '确认恢复'
        );
    }

    function restoreBackup(data) {
        // 1. 保存当前数据快照
        const snapshot = {
            format: FORMAT_TAG + '_snapshot',
            schemaVersion: SCHEMA_VERSION,
            exportedAt: new Date().toISOString(),
            projects: appData.projects,
            persons: appData.persons,
            personTasks: appData.personTasks,
            settings: appData.settings
        };
        try {
            localStorage.setItem(STORAGE_KEY + '_snapshot', JSON.stringify(snapshot));
        } catch (e) {
            showToast('快照保存失败，取消恢复（原数据不变）', 'error');
            return;
        }

        // 2. 恢复数据
        appData.projects = data.projects.map(p => Object.assign(emptyProject(), p));
        appData.persons = data.persons.map(p => Object.assign(emptyPerson(), p));
        appData.personTasks = data.personTasks.map(t => Object.assign(emptyPersonTask(), t));
        appData.settings = data.settings || {};

        const ok = saveData();
        if (!ok) {
            // 恢复失败，还原快照
            try {
                const snap = JSON.parse(localStorage.getItem(STORAGE_KEY + '_snapshot'));
                if (snap) {
                    appData.projects = snap.projects;
                    appData.persons = snap.persons;
                    appData.personTasks = snap.personTasks;
                }
            } catch(e2) {}
            showToast('保存失败，恢复取消（原数据保留）', 'error');
            return;
        }

        renderBoard();
        showToast(`恢复成功：${data.projects.length} 个项目`, 'success');
    }

    /* ===========================================================
     * 13. 搜索
     * =========================================================== */
    document.getElementById('searchInput').addEventListener('input', () => {
        if (currentView === 'project') renderBoard();
        else renderPersonView();
    });

    /* ===========================================================
     * 14. 窗口关闭保存
     * =========================================================== */
    window.addEventListener('beforeunload', () => { saveData(); });
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') saveData();
    });

    /* ===========================================================
     * 15. 初始化
     * =========================================================== */
    loadData();

    // 如果没有任何数据，添加一条示例项目
    if (appData.projects.length === 0) {
        const demo = emptyProject({
            name: '示例：毕业季写真',
            date: '2026-05-15',
            rating: 4,
            totalPhotos: 2300,
            reviewedPhotos: 1380,
            resourceIPad: true,
            location: '城市公园',
        });
        appData.projects.push(demo);
        saveData();
    }

    renderBoard();

    // 窗口缩放时调整面板大小
    window.addEventListener('resize', () => {
        const panel = document.getElementById('detailPanel');
        if (panel.classList.contains('active')) {
            const targetW = Math.min(780, window.innerWidth * 0.92);
            const targetH = Math.min(88 * window.innerHeight / 100, window.innerHeight * 0.9);
            panel.style.left = ((window.innerWidth - targetW) / 2) + 'px';
            panel.style.top = ((window.innerHeight - targetH) / 2) + 'px';
            panel.style.width = targetW + 'px';
            panel.style.height = targetH + 'px';
        }
    });

    </script>
