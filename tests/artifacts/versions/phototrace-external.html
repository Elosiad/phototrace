<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoTrace · 摄影项目管理</title>
    <style>
        /* ===== 全局 CSS 变量 ===== */
        :root {
            --bg-gradient: radial-gradient(circle at 10% 20%, #0f172a 0%, #1e1b4b 50%, #0a0a14 100%);
            --header-bg: rgba(15, 23, 42, 0.82);
            --header-border: rgba(255,255,255,0.08);
            --column-bg: rgba(22, 27, 46, 0.88);
            --column-border: rgba(255,255,255,0.07);
            --card-bg: #1a1f38;
            --card-border: rgba(255,255,255,0.08);
            --card-hover-border: rgba(99,102,241,0.4);
            --card-shadow: 0 4px 12px rgba(0,0,0,0.35);
            --card-hover-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 16px rgba(99,102,241,0.15);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-glow: rgba(99,102,241,0.3);
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --orange: #f97316;
            --modal-bg: #181d30;
            --modal-border: rgba(255,255,255,0.12);
            --input-bg: rgba(15,20,35,0.7);
            --input-border: rgba(255,255,255,0.12);
            --col-suspended: rgba(100,116,139,0.15);
            --col-pending: rgba(14,165,233,0.12);
            --col-screened: rgba(99,102,241,0.12);
            --col-edited: rgba(16,185,129,0.12);
            --col-done: rgba(245,158,11,0.12);
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* ===== 顶部导航 ===== */
        header {
            height: 56px;
            min-height: 56px;
            background: var(--header-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--header-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 200;
            flex-shrink: 0;
            gap: 12px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 17px;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .logo-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px var(--accent-glow);
            flex-shrink: 0;
        }

        .header-center {
            display: flex;
            gap: 6px;
        }

        .view-tab {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.18s;
            font-family: inherit;
        }
        .view-tab:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }
        .view-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .save-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--text-muted);
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            white-space: nowrap;
        }

        .save-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .save-dot.error { background: var(--danger); }
        .save-dot.pending { background: var(--warning); animation: blink 1s infinite; }

        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .btn-header {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.06);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.18s;
            font-family: inherit;
        }
        .btn-header:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
        .btn-header.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-header.primary:hover { background: var(--accent-hover); }

        /* ===== 搜索框 ===== */
        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 9px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-input {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            padding: 6px 10px 6px 30px;
            width: 180px;
            font-family: inherit;
            transition: all 0.18s;
        }
        .search-input:focus { outline: none; border-color: var(--accent); width: 220px; background: var(--input-bg); }
        .search-input::placeholder { color: var(--text-muted); }

        /* ===== 主内容区 ===== */
        .main-content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== 项目视图：看板 ===== */
        #projectView {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        /* 筛选栏 */
        .filter-bar {
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.15);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .filter-chip {
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .filter-chip:hover { border-color: rgba(255,255,255,0.18); color: var(--text-primary); }
        .filter-chip.active { background: rgba(99,102,241,0.2); border-color: var(--accent); color: var(--accent); }

        .filter-select {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 12px;
            padding: 3px 8px;
            cursor: pointer;
            font-family: inherit;
        }
        .filter-select:focus { outline: none; border-color: var(--accent); }

        /* 看板画布 */
        .board-canvas {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            overflow-x: auto;
            overflow-y: hidden;
            flex: 1;
            align-items: flex-start;
        }
        .board-canvas::-webkit-scrollbar { height: 6px; }
        .board-canvas::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        .board-canvas::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

        /* 看板列 */
        .board-column {
            min-width: 260px;
            max-width: 260px;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            border: 1px solid var(--column-border);
            background: var(--column-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            max-height: calc(100vh - 130px);
        }

        .board-column[data-col="suspended"] { background: var(--col-suspended); }
        .board-column[data-col="pending"]   { background: var(--col-pending); }
        .board-column[data-col="screened"]  { background: var(--col-screened); }
        .board-column[data-col="edited"]    { background: var(--col-edited); }
        .board-column[data-col="done"]      { background: var(--col-done); }

        .column-header {
            padding: 12px 14px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
        }

        .column-title {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .column-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .column-count {
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(255,255,255,0.07);
            padding: 2px 7px;
            border-radius: 10px;
        }

        .column-body {
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .column-body::-webkit-scrollbar { width: 4px; }
        .column-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        /* 卡片 */
        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 11px 12px;
            cursor: pointer;
            transition: border-color 0.18s, box-shadow 0.18s, transform 0.15s;
            box-shadow: var(--card-shadow);
            position: relative;
        }
        .project-card:hover {
            border-color: var(--card-hover-border);
            box-shadow: var(--card-hover-shadow);
            transform: translateY(-1px);
        }
        .project-card.card-animating {
            transition: transform 0.32s cubic-bezier(0.16,1,0.3,1), opacity 0.32s cubic-bezier(0.16,1,0.3,1);
        }

        .card-date {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .card-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 7px;
            line-height: 1.4;
        }

        .card-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 6px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 8px;
            font-weight: 500;
        }

        .badge-rating { background: rgba(245,158,11,0.15); color: var(--warning); }
        .badge-resource-ipad { background: rgba(14,165,233,0.15); color: #0ea5e9; }
        .badge-resource-pc { background: rgba(168,85,247,0.15); color: #a855f7; }
        .badge-suspend { background: rgba(100,116,139,0.2); color: var(--text-secondary); }
        .badge-group { background: rgba(99,102,241,0.15); color: #818cf8; }

        .card-people-summary {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        /* 进度条 */
        .card-progress {
            margin-top: 7px;
        }

        .progress-bar-bg {
            background: rgba(255,255,255,0.07);
            border-radius: 4px;
            height: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--accent), #818cf8);
            transition: width 0.4s cubic-bezier(0.16,1,0.3,1);
        }

        .progress-text {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 3px;
            text-align: right;
        }

        .card-completion-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 5px;
        }
        .card-completion-tag.published { background: rgba(16,185,129,0.15); color: var(--success); }
        .card-completion-tag.no-followup { background: rgba(100,116,139,0.2); color: var(--text-secondary); }

        /* 新建项目按钮（列底部） */
        .btn-add-project {
            margin: 6px 8px;
            padding: 8px;
            border: 1px dashed rgba(255,255,255,0.12);
            border-radius: 8px;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-family: inherit;
        }
        .btn-add-project:hover { border-color: var(--accent); color: var(--accent); background: rgba(99,102,241,0.06); }

        /* ===== 人物视图 ===== */
        #personView {
            display: none;
            flex: 1;
            overflow: hidden;
            flex-direction: column;
        }

        .person-board {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            overflow-x: auto;
            flex: 1;
            align-items: flex-start;
        }

        .person-column {
            min-width: 280px;
            max-width: 280px;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            border: 1px solid var(--column-border);
            background: var(--column-bg);
            backdrop-filter: blur(8px);
            max-height: calc(100vh - 130px);
        }

        .person-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            transition: border-color 0.18s, box-shadow 0.18s;
            box-shadow: var(--card-shadow);
        }
        .person-card:hover { border-color: var(--card-hover-border); box-shadow: var(--card-hover-shadow); }

        .person-card-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .person-card-project {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ===== 详情面板（从卡片展开）===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0);
            z-index: 500;
            pointer-events: none;
            transition: background 0.28s;
        }
        .modal-overlay.active { background: rgba(0,0,0,0.65); pointer-events: all; }

        .detail-panel {
            position: fixed;
            z-index: 510;
            background: var(--modal-bg);
            border: 1px solid var(--modal-border);
            border-radius: 16px;
            overflow: hidden;
            display: none;
            flex-direction: column;
            box-shadow: 0 24px 64px rgba(0,0,0,0.6);
        }
        .detail-panel.active { display: flex; }

        .panel-header {
            padding: 16px 18px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .panel-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .btn-close {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.15s;
            font-family: inherit;
        }
        .btn-close:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }

        .panel-body {
            overflow-y: auto;
            flex: 1;
            padding: 16px 18px;
        }
        .panel-body::-webkit-scrollbar { width: 4px; }
        .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

        /* 面板区块 */
        .panel-section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        /* 数量编辑 */
        .qty-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .qty-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 8px;
            padding: 10px 12px;
        }

        .qty-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .qty-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .qty-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 700;
            font-family: inherit;
            padding: 0;
        }
        .qty-input:focus { outline: none; }
        .qty-input::placeholder { color: var(--text-muted); font-size: 14px; font-weight: 400; }

        /* 操作按钮组 */
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.06);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn.primary:hover { background: var(--accent-hover); }
        .btn.success { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.3); color: var(--success); }
        .btn.success:hover { background: rgba(16,185,129,0.25); }
        .btn.danger { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.25); color: var(--danger); }
        .btn.danger:hover { background: rgba(239,68,68,0.2); }
        .btn.warning { background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.25); color: var(--warning); }
        .btn.warning:hover { background: rgba(245,158,11,0.2); }
        .btn.active-toggle { background: rgba(16,185,129,0.2); border-color: var(--success); color: var(--success); }

        /* 人物任务列表 */
        .people-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .person-task-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            transition: border-color 0.15s;
        }
        .person-task-row:hover { border-color: rgba(255,255,255,0.12); }
        .person-task-row.excluded { opacity: 0.5; }

        .person-check {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .person-check.checked { background: var(--accent); border-color: var(--accent); }
        .person-check.checked::after {
            content: '';
            width: 8px;
            height: 6px;
            border-left: 2px solid #fff;
            border-bottom: 2px solid #fff;
            transform: rotate(-45deg) translateY(-1px);
            display: block;
        }

        .person-name {
            font-size: 13px;
            color: var(--text-primary);
            flex: 1;
        }

        .person-status-badges {
            display: flex;
            gap: 4px;
        }

        .status-pip {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            opacity: 0.35;
        }
        .status-pip.active { opacity: 1; }
        .status-pip.edited { background: #818cf8; }
        .status-pip.published { background: var(--success); }

        /* 表单输入 */
        .form-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            padding: 8px 12px;
            font-family: inherit;
            transition: border-color 0.15s;
        }
        .form-input:focus { outline: none; border-color: var(--accent); }
        .form-input::placeholder { color: var(--text-muted); }

        .form-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            margin-bottom: 8px;
        }

        .form-field {
            flex: 1;
        }

        .form-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: block;
        }

        /* 资源开关 */
        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            cursor: pointer;
            transition: all 0.15s;
        }
        .toggle-switch:hover { border-color: rgba(255,255,255,0.12); }

        .toggle-track {
            width: 36px;
            height: 20px;
            border-radius: 10px;
            background: rgba(255,255,255,0.12);
            position: relative;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .toggle-track.on { background: var(--accent); }

        .toggle-thumb {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.2s cubic-bezier(0.16,1,0.3,1);
        }
        .toggle-track.on .toggle-thumb { transform: translateX(16px); }

        .toggle-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* 存储位置 */
        .storage-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .storage-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 9px;
            border-radius: 8px;
            font-size: 11px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }
        .storage-tag.active { background: rgba(99,102,241,0.15); border-color: var(--accent); color: #818cf8; }
        .storage-tag:hover:not(.active) { border-color: rgba(255,255,255,0.18); }

        /* 星级评分 */
        .rating-row {
            display: flex;
            gap: 4px;
        }
        .star {
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.12s;
            line-height: 1;
        }
        .star:hover { transform: scale(1.2); }
        .star.filled { color: var(--warning); }
        .star.empty { color: rgba(255,255,255,0.15); }

        /* 确认对话框 */
        .confirm-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 600;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .confirm-backdrop.active { display: flex; }

        .confirm-dialog {
            background: #1a1f38;
            border: 1px solid var(--modal-border);
            border-radius: 14px;
            padding: 24px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 24px 64px rgba(0,0,0,0.6);
        }

        .confirm-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .confirm-message {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.6;
            white-space: pre-line;
        }

        .confirm-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* 提示 toast */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            animation: toastIn 0.25s cubic-bezier(0.16,1,0.3,1) forwards;
            pointer-events: none;
        }
        .toast.success { background: rgba(16,185,129,0.9); color: #fff; }
        .toast.error { background: rgba(239,68,68,0.9); color: #fff; }
        .toast.warning { background: rgba(245,158,11,0.9); color: #fff; }
        .toast.info { background: rgba(99,102,241,0.9); color: #fff; }

        @keyframes toastIn {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* 项目新建表单 */
        .new-project-form {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 12px;
            margin: 6px 8px;
            display: none;
        }
        .new-project-form.visible { display: block; }

        /* 分隔线 */
        .divider {
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 12px 0;
        }

        /* 展开/折叠区域 */
        .collapsible-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            padding: 6px 0;
        }
        .collapsible-arrow {
            transition: transform 0.2s;
            color: var(--text-muted);
            font-size: 12px;
        }
        .collapsible-arrow.open { transform: rotate(90deg); }
        .collapsible-body {
            overflow: hidden;
            transition: max-height 0.25s cubic-bezier(0.16,1,0.3,1);
        }

        /* 批量操作工具栏 */
        .bulk-toolbar {
            background: rgba(99,102,241,0.12);
            border: 1px solid rgba(99,102,241,0.25);
            border-radius: 8px;
            padding: 8px 12px;
            display: none;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .bulk-toolbar.active { display: flex; }
        .bulk-count { font-size: 12px; color: var(--accent); font-weight: 600; }

        /* 备注区域 */
        textarea.form-input {
            resize: vertical;
            min-height: 70px;
        }

        /* 已有成果区块 */
        .results-summary {
            background: rgba(16,185,129,0.06);
            border: 1px solid rgba(16,185,129,0.15);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .results-summary strong { color: var(--success); }

        /* 编辑草稿状态指示 */
        .draft-banner {
            display: none;
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.25);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--warning);
            margin-bottom: 12px;
            align-items: center;
            gap: 6px;
        }
        .draft-banner.active { display: flex; }

        /* 错误提示 */
        .error-hint {
            font-size: 11px;
            color: var(--danger);
            margin-top: 4px;
            display: none;
        }
        .error-hint.active { display: block; }

        /* 重新初筛提示条 */
        .rescreen-banner {
            background: rgba(249,115,22,0.1);
            border: 1px solid rgba(249,115,22,0.25);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--orange);
            margin-bottom: 12px;
        }

        /* 输入框验证高亮 */
        .qty-item.invalid { border-color: rgba(239,68,68,0.5); }
        .qty-item.invalid .qty-label { color: var(--danger); }

        /* 人物视图空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 13px;
            gap: 8px;
            text-align: center;
        }
        .empty-icon { font-size: 28px; opacity: 0.4; }

        /* 发布链接 */
        .publish-link-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 4px;
        }

        .publish-link-input {
            flex: 1;
        }

        /* 团体分组标题 */
        .group-header {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            padding: 4px 0 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .group-rating {
            font-size: 10px;
            background: rgba(245,158,11,0.15);
            color: var(--warning);
            padding: 1px 6px;
            border-radius: 6px;
        }

        /* 进度摘要行 */
        .progress-summary {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .progress-phase {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 8px;
            padding: 8px 10px;
            text-align: center;
        }

        .progress-phase-label {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        .progress-phase-value {
            font-size: 14px;
            font-weight: 700;
        }

        /* 卡片进入动画 */
        @keyframes cardSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-new { animation: cardSlideIn 0.25s cubic-bezier(0.16,1,0.3,1) forwards; }

        /* 减少动态效果支持 */
        @media (prefers-reduced-motion: reduce) {
            .project-card, .board-column, .detail-panel, .progress-bar-fill,
            .collapsible-body, .modal-overlay { transition: none !important; animation: none !important; }
        }

        /* 无数据提示 */
        .no-data-column {
            padding: 20px 10px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
        }

        /* 确认恢复链接 */
        a { color: var(--accent); text-decoration: underline; cursor: pointer; }

        /* 人物任务编辑面板 */
        .person-detail-panel {
            position: fixed;
            z-index: 520;
            background: var(--modal-bg);
            border: 1px solid var(--modal-border);
            border-radius: 14px;
            width: min(420px, 90vw);

        .person-detail-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        /* 加载遮罩 */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10,10,20,0.85);
            z-index: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-secondary);
            flex-direction: column;
            gap: 12px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 导入文件隐藏 */
        #importFileInput { display: none; }
    </style>
</head>
<body>

    <!-- 主内容 -->

                <button class="btn primary" id="btnConfirmOk">确认</button>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
    'use strict';

    /* ===========================================================
     * 1. 数据结构定义与业务常量
     * =========================================================== */
    const STORAGE_KEY = 'phototrace_data_v1';
    const SCHEMA_VERSION = 1;
    const FORMAT_TAG = 'phototrace';

    // 看板列定义
    const COLUMNS = [
        { id: 'suspended', label: '挂起',   dotColor: '#64748b', description: '暂停处理' },
        { id: 'pending',   label: '待筛选', dotColor: '#0ea5e9', description: '等待初筛' },
        { id: 'screened',  label: '已筛选', dotColor: '#6366f1', description: '初筛完成' },
        { id: 'edited',    label: '已修图', dotColor: '#10b981', description: '修图完成' },
        { id: 'done',      label: '已完成', dotColor: '#f59e0b', description: '发布或无需后续' },
    ];

    // 四阶段权重
    const PHASE_WEIGHTS = { import: 0.30, screen: 0.30, edit: 0.30, publish: 0.10 };

    // 存储位置选项
    const STORAGE_OPTIONS = ['iPad', '移动硬盘', 'NAS', 'PC本地', '已清理'];

    /* ===========================================================
     * 2. 初始数据模板
     * =========================================================== */
    function emptyProject(overrides) {
        return Object.assign({
            id: genId('proj'),
            name: '',
            date: '',
            rating: 0,                  // 0-5
            notes: '',
            isSuspended: false,
            // 资源占用
            resourceIPad: false,
            resourcePC: false,
            // 存储
            storageLocations: [],
            cloudBackup: false,
            archiveLong: false,
            // 场地、设备
            location: '',
            equipment: '',
            // 数量字段（null = 未知）
            // totalPhotos:   原片总数
            // pendingPhotos: 待筛选数（尚未浏览的数量），已浏览 = totalPhotos - pendingPhotos
            // selectedPhotos: 初筛入选数
            // exportedPhotos: 精修导出数
            totalPhotos: null,
            pendingPhotos: null,
            selectedPhotos: null,
            exportedPhotos: null,
            // 初筛状态
            screeningConfirmed: false,  // 曾经确认过人物名单
            reScreening: false,         // 重新初筛中
            // 团体（可选分组）
            groups: [],                 // [{id, name, rating}]
            // 人物任务 IDs（通过 personTasks 关联）
        }, overrides);
    }

    function emptyPerson(overrides) {
        return Object.assign({
            id: genId('person'),
            name: '',
        }, overrides);
    }

    function emptyPersonTask(overrides) {
        return Object.assign({
            id: genId('task'),
            projectId: '',
            personId: '',
            groupId: null,              // 团体 ID（可选）
            editDone: false,
            publishDone: false,
            publishLink: '',
            exportCount: null,
            excluded: false,            // 标记不再处理
        }, overrides);
    }

    function emptyGroup(overrides) {
        return Object.assign({
            id: genId('grp'),
            name: '',
            rating: 0,
        }, overrides);
    }

    /* ===========================================================
     * 3. 数据持久化
     * =========================================================== */
    let appData = {
        schemaVersion: SCHEMA_VERSION,
        projects: [],
        persons: [],
        personTasks: [],
        settings: {}
    };

    let saveError = false;

    function loadData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            const parsed = JSON.parse(raw);
            if (!parsed || parsed.format !== FORMAT_TAG) return;
            if (!Array.isArray(parsed.projects)) return;
            // 合并，防止字段缺失
            appData.projects = (parsed.projects || []).map(p => Object.assign(emptyProject(), p));
            appData.persons = (parsed.persons || []).map(p => Object.assign(emptyPerson(), p));
            appData.personTasks = (parsed.personTasks || []).map(t => Object.assign(emptyPersonTask(), t));
            appData.settings = parsed.settings || {};
            saveError = false;
        } catch (e) {
            console.error('加载数据失败', e);
            // 不用空数据覆盖，保留现有 appData
        }
    }

    function saveData() {
        const payload = {
            format: FORMAT_TAG,
            schemaVersion: SCHEMA_VERSION,
            exportedAt: new Date().toISOString(),
            projects: appData.projects,
            persons: appData.persons,
            personTasks: appData.personTasks,
            settings: appData.settings
        };
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            setSaveStatus('ok');
            return true;
        } catch (e) {
            console.error('保存失败', e);
            setSaveStatus('error');
            return false;
        }
    }

    function setSaveStatus(status) {
        const dot = document.getElementById('saveDot');
        const text = document.getElementById('saveText');
        if (status === 'ok') {
            dot.className = 'save-dot';
            const t = new Date();
            text.textContent = `已保存 ${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}`;
            saveError = false;
        } else if (status === 'error') {
            dot.className = 'save-dot error';
            text.textContent = '保存失败！';
            saveError = true;
        } else if (status === 'pending') {
            dot.className = 'save-dot pending';
            text.textContent = '未保存...';
        }
    }

    /* ===========================================================
     * 4. 工具函数
     * =========================================================== */
    function genId(prefix) {
        return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
    }

    function escHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, m =>
            ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]);
    }

    function formatDate(d) {
        if (!d) return '';
        return d.replace(/^(\d{4})-(\d{2})-(\d{2})$/, '$1/$2/$3');
    }

    function showToast(msg, type = 'info', duration = 3000) {

            t.style.transform = 'translateY(8px)';
            t.style.transition = 'all 0.25s';

    let confirmCallback = null;
    function showConfirm(title, message, onOk, okLabel = '确认') {
        document.getElementById('confirmTitle').textContent = title;
        document.getElementById('confirmMessage').textContent = message;

    /* ===========================================================
     * 5. 业务计算：状态推导
     * =========================================================== */

    /**
     * 计算项目综合进度（0-100）
     * 四阶段：导入30%、初筛30%、修图30%、发布10%
     */
    function calcProgress(proj) {
        const tasks = getActiveTasksForProject(proj.id);
        const n = tasks.length;

        // 导入进度（30%）：有 totalPhotos 即视为导入完成
        let importPct = (proj.totalPhotos != null && proj.totalPhotos >= 0) ? 1.0 : 0;

        // 初筛进度（30%）
        let screenPct = 0;
        if (proj.screeningConfirmed) {
            // 曾经确认过，若当前不在重新初筛中则为完成
            screenPct = proj.reScreening ? 0.5 : 1.0;
        } else if (proj.pendingPhotos != null && proj.totalPhotos != null && proj.totalPhotos > 0) {
            // 已浏览 = totalPhotos - pendingPhotos
            const reviewed = Math.max(0, proj.totalPhotos - proj.pendingPhotos);
            screenPct = Math.min(1, reviewed / proj.totalPhotos);
        }

        // 修图进度（30%）
        let editPct = 0;
        if (proj.screeningConfirmed) {
            if (n === 0) {
                editPct = 1.0; // 零分母按100%
            } else {
                editPct = tasks.filter(t => t.editDone).length / n;
            }
        }

        // 发布进度（10%）
        let publishPct = 0;
        if (proj.screeningConfirmed) {
            if (n === 0) {
                publishPct = 1.0;
            } else {
                publishPct = tasks.filter(t => t.publishDone).length / n;
            }
        }

        const total = importPct * PHASE_WEIGHTS.import
                    + screenPct * PHASE_WEIGHTS.screen
                    + editPct   * PHASE_WEIGHTS.edit
                    + publishPct * PHASE_WEIGHTS.publish;

        return {
            total: Math.round(total * 100),
            import: Math.round(importPct * 100),
            screen: Math.round(screenPct * 100),
            edit: Math.round(editPct * 100),
            publish: Math.round(publishPct * 100),
            activeTasks: n,
            editDone: tasks.filter(t => t.editDone).length,
            publishDone: tasks.filter(t => t.publishDone).length,
        };
    }

    /**
     * 推导项目宏观状态（对应看板列 id）
     */
    function calcProjectStatus(proj) {
        if (proj.isSuspended) return 'suspended';

        const progress = calcProgress(proj);

        // 全部阶段100% → 已完成
        if (progress.total >= 100) return 'done';

        // 修图或发布有进度 → 已筛选（进入后期）
        if (proj.screeningConfirmed && !proj.reScreening) {
            const tasks = getActiveTasksForProject(proj.id);
            const n = tasks.length;
            if (n === 0) return 'done'; // 零有效人物直接完成
            const editDone = tasks.filter(t => t.editDone).length;
            const publishDone = tasks.filter(t => t.publishDone).length;
            if (publishDone === n) return 'done';
            if (editDone === n) return 'edited';
            return 'screened';
        }

        // 初筛完成（确认过名单）
        if (proj.screeningConfirmed) return 'pending'; // 重新初筛中，退回待筛选

        // 未确认名单
        const reviewed = proj.reviewedPhotos || 0;
        const total = proj.totalPhotos;
        if (total != null && total > 0 && reviewed > 0) return 'pending';

        return 'pending'; // 新建项目默认待筛选
    }

    /**
     * 获取项目的有效人物任务（未排除、不在重新初筛中）
     */
    function getActiveTasksForProject(projId) {
        return appData.personTasks.filter(t =>
            t.projectId === projId &&
            !t.excluded
        );
    }

    function getAllTasksForProject(projId) {
        return appData.personTasks.filter(t => t.projectId === projId);
    }

    function getPersonById(id) {
        return appData.persons.find(p => p.id === id);
    }

    function getProjectById(id) {
        return appData.projects.find(p => p.id === id);
    }

    /**
     * 完成原因标签
     */
    function getCompletionReason(proj) {
        const tasks = getActiveTasksForProject(proj.id);
        if (tasks.length === 0 && proj.screeningConfirmed) return 'no-followup';
        if (tasks.length > 0 && tasks.every(t => t.publishDone)) return 'published';
        return null;
    }

    /**
     * 是否进行中（占用资源）
     */
    function isInProgress(proj) {
        return proj.resourceIPad || proj.resourcePC;
    }

    /* ===========================================================
     * 6. 视图切换
     * =========================================================== */
    let currentView = 'project';

    function switchView(view) {
        currentView = view;
        document.getElementById('projectView').style.display = view === 'project' ? 'flex' : 'none';
        document.getElementById('personView').style.display = view === 'person' ? 'flex' : 'none';
        document.getElementById('tabProject').classList.toggle('active', view === 'project');
        document.getElementById('tabPerson').classList.toggle('active', view === 'person');

        if (view === 'project') renderBoard();
        else renderPersonView();
    }

    /* ===========================================================
     * 7. 筛选状态
     * =========================================================== */
    let activeFilter = 'all';

    function setFilter(filter, btn) {
        activeFilter = filter;
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        renderBoard();
    }

    function applyFilters() {
        renderBoard();
    }

    function getFilteredProjects() {
        const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
        const ratingFilter = parseInt(document.getElementById('filterRating').value) || 0;
        const resourceFilter = document.getElementById('filterResource').value;

        return appData.projects.filter(proj => {
            // 文本搜索
            if (query) {
                const tasks = getAllTasksForProject(proj.id);
                const personNames = tasks.map(t => {
                    const p = getPersonById(t.personId);
                    return p ? p.name.toLowerCase() : '';
                });
                const groupNames = (proj.groups || []).map(g => g.name.toLowerCase());
                const matchName = proj.name.toLowerCase().includes(query);
                const matchDate = proj.date.includes(query);
                const matchPerson = personNames.some(n => n.includes(query));
                const matchGroup = groupNames.some(n => n.includes(query));
                if (!matchName && !matchDate && !matchPerson && !matchGroup) return false;
            }

            // 状态筛选
            if (activeFilter === 'in-progress' && !isInProgress(proj)) return false;
            if (activeFilter === 'suspended' && !proj.isSuspended) return false;

            // 评级
            if (ratingFilter > 0 && proj.rating < ratingFilter) return false;

            // 资源
            if (resourceFilter === 'ipad' && !proj.resourceIPad) return false;
            if (resourceFilter === 'pc' && !proj.resourcePC) return false;
            if (resourceFilter === 'none' && (proj.resourceIPad || proj.resourcePC)) return false;

            return true;
        });
    }

    /* ===========================================================
     * 8. 看板渲染
     * =========================================================== */
    function renderBoard() {
        const canvas = document.getElementById('boardCanvas');
        const filteredProjects = getFilteredProjects();

        // 清空画布（保留现有列元素，用 FLIP 更新）
        canvas.innerHTML = '';

        COLUMNS.forEach(col => {
            const colProjects = filteredProjects.filter(p => calcProjectStatus(p) === col.id);
            // 排序：按评级降序，同评级按日期降序
            colProjects.sort((a, b) => {
                if (b.rating !== a.rating) return b.rating - a.rating;
                return (b.date || '').localeCompare(a.date || '');
            });

            const colEl = buildColumnEl(col, colProjects);
            canvas.appendChild(colEl);
        });
    }

    function buildColumnEl(col, projects) {
        const el = document.createElement('div');
        el.className = 'board-column';
        el.dataset.col = col.id;

        el.innerHTML = `
            <div class="column-header">
                <div class="column-title">
                    <div class="column-dot" style="background:${col.dotColor}"></div>
                    ${escHtml(col.label)}
                </div>
                <div class="column-count">${projects.length}</div>
            </div>
            <div class="column-body" id="col-body-${col.id}"></div>
        `;

        const body = el.querySelector(`#col-body-${col.id}`);

        if (projects.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'no-data-column';
            empty.textContent = '暂无项目';
            body.appendChild(empty);
        } else {
            projects.forEach(proj => {
                const card = buildProjectCard(proj);
                body.appendChild(card);
            });
        }

        // 待筛选列和已筛选列添加新建按钮
        if (col.id === 'pending') {
            const btn = document.createElement('button');
            btn.className = 'btn-add-project';
            btn.innerHTML = `
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                新建项目
            `;
            btn.onclick = () => openNewProjectPanel();
            el.appendChild(btn);
        }

        return el;
    }

    function buildProjectCard(proj) {
        const card = document.createElement('div');
        card.className = 'project-card';
        card.dataset.projId = proj.id;

        const progress = calcProgress(proj);
        const status = calcProjectStatus(proj);
        const inProg = isInProgress(proj);
        const tasks = getActiveTasksForProject(proj.id);

        // 徽章
        let badgesHtml = '';
        if (proj.rating > 0) {
            badgesHtml += `<span class="badge badge-rating">★${proj.rating}</span>`;
        }
        if (proj.resourceIPad) {
            badgesHtml += `<span class="badge badge-resource-ipad">iPad</span>`;
        }
        if (proj.resourcePC) {
            badgesHtml += `<span class="badge badge-resource-pc">像素蛋糕</span>`;
        }
        if (proj.isSuspended) {
            badgesHtml += `<span class="badge badge-suspend">挂起</span>`;
        }
        if (proj.resourceIPad && proj.isSuspended) {
            badgesHtml = badgesHtml + `<span style="font-size:10px;color:var(--warning)">⚠ 挂起仍占资源</span>`;
        }

        // 人物摘要
        let peopleSummary = '';
        if (proj.screeningConfirmed && !proj.reScreening) {
            const n = tasks.length;
            if (n === 0) {
                peopleSummary = `<div class="card-people-summary">无有效人物任务</div>`;
            } else {
                const editDone = tasks.filter(t => t.editDone).length;
                const pubDone = tasks.filter(t => t.publishDone).length;
                peopleSummary = `<div class="card-people-summary">修图 ${editDone}/${n} · 发布 ${pubDone}/${n}</div>`;
            }
        } else if (proj.reScreening) {
            peopleSummary = `<div class="card-people-summary" style="color:var(--orange)">重新初筛中…</div>`;
        }

        // 进度条（仅进行中显示）
        let progressHtml = '';
        if (inProg && !proj.isSuspended) {
            progressHtml = `
                <div class="card-progress">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width:${progress.total}%"></div>
                    </div>
                    <div class="progress-text">${progress.total}%</div>
                </div>
            `;
        }

        // 完成标签
        let completionHtml = '';
        if (status === 'done') {
            const reason = getCompletionReason(proj);
            if (reason === 'published') {
                completionHtml = `<div class="card-completion-tag published">✓ 已发布</div>`;
            } else if (reason === 'no-followup') {
                completionHtml = `<div class="card-completion-tag no-followup">✓ 无需后续处理</div>`;
            }
        }

        // 数量信息
        let qtyHtml = '';
        const total = proj.totalPhotos;
        const selected = proj.selectedPhotos;
        if (total != null || selected != null) {
            const parts = [];
            if (total != null) parts.push(`原片 ${total}`);
            if (selected != null) parts.push(`入选 ${selected}`);
            qtyHtml = `<div class="card-people-summary" style="font-size:11px;">${parts.join(' · ')}</div>`;
        }

        card.innerHTML = `
            <div class="card-date">${formatDate(proj.date)}</div>
            <div class="card-name">${escHtml(proj.name) || '<span style="color:var(--text-muted)">未命名项目</span>'}</div>
            ${badgesHtml ? `<div class="card-badges">${badgesHtml}</div>` : ''}
            ${qtyHtml}
            ${peopleSummary}
            ${completionHtml}
            ${progressHtml}
        `;

        card.addEventListener('click', () => openProjectDetail(proj.id));
        return card;
    }

    /* ===========================================================
     * 9. 项目详情面板
     * =========================================================== */
    let currentProjId = null;
    let draftData = null;  // 数量草稿

    function openProjectDetail(projId) {
        currentProjId = projId;
        draftData = null;

        const panel = document.getElementById('detailPanel');
        const overlay = document.getElementById('modalOverlay');
        const proj = getProjectById(projId);
        if (!proj) return;

        // 先让面板可见（从卡片位置展开动画）
        const cardEl = document.querySelector(`[data-proj-id="${projId}"]`);
        if (cardEl && !panel.classList.contains('active')) {
            const cardRect = cardEl.getBoundingClientRect();
            const targetW = Math.min(780, window.innerWidth * 0.92);
            const targetH = Math.min(88 * window.innerHeight / 100, window.innerHeight * 0.9);
            const targetLeft = (window.innerWidth - targetW) / 2;
            const targetTop = (window.innerHeight - targetH) / 2;

            panel.style.transition = 'none';
            panel.style.left = cardRect.left + 'px';
            panel.style.top = cardRect.top + 'px';
            panel.style.width = cardRect.width + 'px';
            panel.style.height = cardRect.height + 'px';
            panel.style.opacity = '0.5';
            panel.classList.add('active');

            overlay.classList.add('active');
            cardEl.style.opacity = '0.2';

            requestAnimationFrame(() => {
                panel.offsetHeight; // 强制 reflow
                panel.style.transition = 'all 0.36s cubic-bezier(0.16,1,0.3,1)';
                panel.style.left = targetLeft + 'px';
                panel.style.top = targetTop + 'px';
                panel.style.width = targetW + 'px';
                panel.style.height = targetH + 'px';
                panel.style.opacity = '1';
            });
        } else {
            // 直接显示（例如：已打开面板时切换项目）
            const targetW = Math.min(780, window.innerWidth * 0.92);
            const targetH = Math.min(88 * window.innerHeight / 100, window.innerHeight * 0.9);
            panel.style.transition = 'none';
            panel.style.left = ((window.innerWidth - targetW) / 2) + 'px';
            panel.style.top = ((window.innerHeight - targetH) / 2) + 'px';
            panel.style.width = targetW + 'px';
            panel.style.height = targetH + 'px';
            panel.style.opacity = '1';
            panel.classList.add('active');
            overlay.classList.add('active');
        }

        renderPanelContent(projId);
    }

    function closeProjectDetail() {
        const panel = document.getElementById('detailPanel');
        const overlay = document.getElementById('modalOverlay');
        const cardEl = document.querySelector(`[data-proj-id="${currentProjId}"]`);

        if (cardEl) {
            const returnRect = cardEl.getBoundingClientRect();
            panel.style.transition = 'all 0.3s cubic-bezier(0.16,1,0.3,1)';
            panel.style.left = returnRect.left + 'px';
            panel.style.top = returnRect.top + 'px';
            panel.style.width = returnRect.width + 'px';
            panel.style.height = returnRect.height + 'px';
            panel.style.opacity = '0.2';
            overlay.classList.remove('active');

            setTimeout(() => {
                panel.classList.remove('active');
                if (cardEl) cardEl.style.opacity = '1';
                currentProjId = null;
                draftData = null;
            }, 300);
        } else {
            overlay.classList.remove('active');
            panel.classList.remove('active');
            currentProjId = null;
            draftData = null;
        }

        renderBoard();
    }

    document.getElementById('btnClosePanel').addEventListener('click', closeProjectDetail);
    document.getElementById('modalOverlay').addEventListener('click', closeProjectDetail);

    window.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            if (document.getElementById('confirmBackdrop').classList.contains('active')) {
                document.getElementById('confirmBackdrop').classList.remove('active');
                confirmCallback = null;
            } else if (document.getElementById('personDetailPanel').classList.contains('active')) {
                closePersonDetail();
            } else if (document.getElementById('detailPanel').classList.contains('active')) {
                closeProjectDetail();
            }
        }
    });

    /* ===== 面板内容渲染 ===== */
    function renderPanelContent(projId) {
        const proj = getProjectById(projId);
        if (!proj) return;

        const progress = calcProgress(proj);
        const status = calcProjectStatus(proj);
        const tasks = getActiveTasksForProject(projId);
        const allTasks = getAllTasksForProject(projId);

        document.getElementById('panelTitle').textContent = proj.name || '未命名项目';
        document.getElementById('panelSubtitle').textContent = formatDate(proj.date) + (proj.location ? ` · ${proj.location}` : '');

        const body = document.getElementById('panelBody');
        body.innerHTML = '';

        // ---------- 进度摘要 ----------
        const progSection = mkSection('综合进度');
        progSection.innerHTML += `
            <div class="progress-summary">
                <div class="progress-phase">
                    <div class="progress-phase-label">导入</div>
                    <div class="progress-phase-value" style="color:${progress.import===100?'var(--success)':'var(--text-primary)'}">${progress.import}%</div>
                </div>
                <div class="progress-phase">
                    <div class="progress-phase-label">初筛</div>
                    <div class="progress-phase-value" style="color:${progress.screen===100?'var(--success)':'var(--text-primary)'}">${progress.screen}%</div>
                </div>
                <div class="progress-phase">
                    <div class="progress-phase-label">修图</div>
                    <div class="progress-phase-value" style="color:${progress.edit===100?'var(--success)':'var(--text-primary)'}">${progress.edit}%</div>
                </div>
                <div class="progress-phase">
                    <div class="progress-phase-label">发布</div>
                    <div class="progress-phase-value" style="color:${progress.publish===100?'var(--success)':'var(--text-primary)'}">${progress.publish}%</div>
                </div>
            </div>
            <div style="margin-bottom:6px;">
                <div class="progress-bar-bg" style="height:8px;">
                    <div class="progress-bar-fill" style="width:${progress.total}%"></div>
                </div>
            </div>
            <div style="font-size:12px; color:var(--text-secondary); text-align:right;">综合进度 ${progress.total}%</div>
        `;
        body.appendChild(progSection);

        // ---------- 重新初筛提示 ----------
        if (proj.reScreening) {
            const rsBanner = document.createElement('div');
            rsBanner.className = 'rescreen-banner';
            rsBanner.textContent = '⟳ 重新初筛进行中：已有成果保留，人物视图暂时隐藏，完成后请再次确认人物名单。';
            body.appendChild(rsBanner);
        }

        // ---------- 数量编辑区 ----------
        const qtySection = mkSection('相关数量');
        renderQtyEditor(qtySection, proj);
        body.appendChild(qtySection);

        // ---------- 初筛操作 ----------
        const screenSection = mkSection('初筛管理');
        renderScreeningSection(screenSection, proj, tasks, allTasks);
        body.appendChild(screenSection);

        // ---------- 人物任务 ----------
        if (proj.screeningConfirmed) {
            const peopleSection = mkSection(`人物任务（有效 ${tasks.length}人）`);
            renderPeopleSection(peopleSection, proj, tasks, allTasks);
            body.appendChild(peopleSection);
        }

        // ---------- 资源与存储 ----------
        const resSection = mkSection('资源与存储');
        renderResourceSection(resSection, proj);
        body.appendChild(resSection);

        // ---------- 项目信息 ----------
        const infoSection = mkSection('项目信息');
        renderInfoSection(infoSection, proj);
        body.appendChild(infoSection);

        // ---------- 已有成果（重新初筛时显示） ----------
        if (proj.reScreening && allTasks.length > 0) {
            const resultSection = mkSection('已有成果（重新初筛前）');
            const editDone = allTasks.filter(t => t.editDone).length;
            const pubDone = allTasks.filter(t => t.publishDone).length;
            const exported = allTasks.reduce((s, t) => s + (t.exportCount || 0), 0);
            resultSection.innerHTML += `
                <div class="results-summary">
                    <strong>修图完成</strong>：${editDone} 人<br>
                    <strong>发布完成</strong>：${pubDone} 人<br>
                    <strong>精修导出</strong>：${exported} 张（合计）
                </div>
            `;
            body.appendChild(resultSection);
        }

        // ---------- 危险操作 ----------
        const dangerSection = mkSection('');
        const dangerBtns = document.createElement('div');
        dangerBtns.className = 'btn-group';

        const btnToggleSuspend = document.createElement('button');
        btnToggleSuspend.className = `btn ${proj.isSuspended ? 'success' : 'warning'}`;
        btnToggleSuspend.textContent = proj.isSuspended ? '▶ 恢复项目' : '⏸ 挂起项目';
        btnToggleSuspend.onclick = () => {
            proj.isSuspended = !proj.isSuspended;
            commitAndRefresh(proj);
        };
        dangerBtns.appendChild(btnToggleSuspend);

        const btnDelete = document.createElement('button');
        btnDelete.className = 'btn danger';
        btnDelete.textContent = '删除项目';
        btnDelete.onclick = () => {
            showConfirm('删除项目', `确定要删除项目「${proj.name}」及其所有人物任务吗？\n此操作不可撤销。`, () => {
                appData.projects = appData.projects.filter(p => p.id !== proj.id);
                appData.personTasks = appData.personTasks.filter(t => t.projectId !== proj.id);
                saveData();
                closeProjectDetail();
                renderBoard();
            }, '确认删除');
        };
        dangerBtns.appendChild(btnDelete);

        dangerSection.appendChild(dangerBtns);
        body.appendChild(dangerSection);
    }

    function mkSection(title) {
        const div = document.createElement('div');
        div.className = 'panel-section';
        if (title) {

                item.appendChild(inp);
            } else {
                const val = document.createElement('div');
                val.className = 'qty-value';
                val.textContent = data[f.key] != null ? String(data[f.key]) : '—';
                item.appendChild(label);
                item.appendChild(val);
            }

            grid.appendChild(item);
        });

        section.appendChild(grid);

        // 错误提示
        const errHint = document.createElement('div');
        errHint.className = 'error-hint';
        errHint.id = 'qtyError';
        section.appendChild(errHint);

        btns.className = 'btn-group';
        btns.style.marginTop = '10px';

            btnEdit.className = 'btn';

                draftData = {
                    projId: proj.id,
                    totalPhotos: proj.totalPhotos,
                    pendingPhotos: proj.pendingPhotos,
                    selectedPhotos: proj.selectedPhotos,
                    exportedPhotos: proj.exportedPhotos,
                };
                renderPanelContent(proj.id);
            };
            btns.appendChild(btnEdit);

            const btnSave = document.createElement('button');
            btnSave.className = 'btn primary';
            btnSave.textContent = '✓ 保存数量';
            btnSave.onclick = () => {
                const err = validateQtyDraft(draftData, proj);
                if (err.hard) {
                    showQtyError(err.hard);
                    return;
                }
                if (err.soft) {
                    showConfirm('确认保存', err.soft + '\n\n是否仍然保存？', () => {
                        applyQtyDraft(proj);
                    }, '确认保存');

                    applyQtyDraft(proj);
                }

    function validateQtyDraft(draft, proj) {
        const { totalPhotos: total, pendingPhotos: pending, selectedPhotos: selected, exportedPhotos: exported } = draft;

        // 非整数/负数检查
        for (const [k, v] of Object.entries({ totalPhotos: total, pendingPhotos: pending, selectedPhotos: selected, exportedPhotos: exported })) {
            if (v != null && (!Number.isInteger(v) || v < 0)) {
                highlightQtyInvalid(k);
                return { hard: `「${fieldLabel(k)}」必须是非负整数` };
            }
        }

        // 待筛选 > 原片
        if (total != null && pending != null && pending > total) {
            highlightQtyInvalid('pendingPhotos');
            return { hard: `待筛选数（${pending}）不能超过原片总数（${total}）` };
        }

        // 入选 > 已浏览（已浏览 = total - pending）
        if (total != null && pending != null && selected != null) {
            const reviewed = total - pending;
            if (selected > reviewed) {
                highlightQtyInvalid('selectedPhotos');
                return { hard: `初筛入选数（${selected}）不能超过已浏览数（${reviewed} = ${total} - ${pending}）` };
            }
        }

        // 精修 > 入选（软提示）
        const currentSelected = selected ?? proj.selectedPhotos ?? 0;
        if (exported != null && currentSelected != null && exported > currentSelected) {
            return { soft: `精修导出数（${exported}）超过当前入选数（${currentSelected}）\n这可能是正常的（如已调整候选范围），保留不自动扣减。` };
        }

        return {};
    }

    function highlightQtyInvalid(key) {
        const item = document.querySelector(`[data-key="${key}"]`);
        if (item) item.classList.add('invalid');
    }

    function showQtyError(msg) {
        const el = document.getElementById('qtyError');
        if (el) { el.textContent = msg; el.classList.add('active'); }
    }

    function fieldLabel(key) {
        return { totalPhotos:'原片总数', reviewedPhotos:'待筛选数', selectedPhotos:'初筛入选数', exportedPhotos:'精修导出数' }[key] || key;
    }

    function applyQtyDraft(proj) {
        proj.totalPhotos = draftData.totalPhotos;
        proj.reviewedPhotos = draftData.reviewedPhotos;
        proj.selectedPhotos = draftData.selectedPhotos;
        proj.exportedPhotos = draftData.exportedPhotos;
        draftData = null;
        commitAndRefresh(proj);
    }

    function updateBulkToolbar(proj) {
        const bar = document.getElementById('bulkToolbar-' + proj.id);
        const countEl = document.getElementById('bulkCount-' + proj.id);

    function toggleTaskEdit(task, proj) {
        if (!task.editDone) {
            // 标记完成
            task.editDone = true;
        } else {
            // 撤销：若已发布，提示
            if (task.publishDone) {
                showConfirm('撤销修图', `人物「${getPersonById(task.personId)?.name}」已标记发布。撤销修图将同时撤销发布标记（保留链接）。确认继续？`, () => {
                    task.editDone = false;
                    task.publishDone = false;
                    commitAndRefresh(proj);
                }, '确认撤销');
                return;
            }
            task.editDone = false;
        }
        commitAndRefresh(proj);
    }

    function toggleTaskPublish(task, proj) {
        if (!task.publishDone) {
            // 需先完成修图
            if (!task.editDone) {
                showToast('请先完成修图再标记发布', 'warning');
                return;
            }
            task.publishDone = true;
        } else {
            task.publishDone = false;
        }
        commitAndRefresh(proj);
    }

    function executeBulkAction(action, proj) {
        if (selectedTaskIds.size === 0) return;
        const selectedTasks = appData.personTasks.filter(t => selectedTaskIds.has(t.id));

        if (action === 'publish') {
            // 检查所有选中任务是否完成修图
            const notEdited = selectedTasks.filter(t => !t.editDone);
            if (notEdited.length > 0) {
                const names = notEdited.map(t => getPersonById(t.personId)?.name || '?').join('、');
                showToast(`以下人物未完成修图：${names}，整批不提交`, 'error');
                return;
            }
        }

        if (action === 'unedit') {
            // 检查已发布的
            const published = selectedTasks.filter(t => t.publishDone);
            if (published.length > 0) {
                const names = published.map(t => getPersonById(t.personId)?.name || '?').join('、');
                showConfirm('撤销修图', `以下人物已发布：${names}\n撤销修图将同时撤销发布标记（保留链接）。确认继续？`, () => {
                    selectedTasks.forEach(t => { t.editDone = false; t.publishDone = false; });
                    selectedTaskIds.clear();
                    commitAndRefresh(proj);
                }, '确认撤销');
                return;
            }
        }

        // 执行操作
        selectedTasks.forEach(t => {
            if (action === 'edit') t.editDone = true;
            else if (action === 'unedit') { t.editDone = false; }
            else if (action === 'publish') t.publishDone = true;
            else if (action === 'unpublish') t.publishDone = false;
            else if (action === 'exclude') t.excluded = true;
            else if (action === 'include') t.excluded = false;
        });

        selectedTaskIds.clear();
        commitAndRefresh(proj);
    }

    function buildToggle(label, value, onChange) {
        const row = document.createElement('div');
        row.className = 'toggle-switch';
        row.style.marginBottom = '6px';
        row.style.cursor = 'pointer';

        const track = document.createElement('div');
        track.className = `toggle-track ${value ? 'on' : ''}`;
        const thumb = document.createElement('div');
        thumb.className = 'toggle-thumb';
        track.appendChild(thumb);

        const lbl = document.createElement('div');
        lbl.className = 'toggle-label';
        lbl.textContent = label;

        row.appendChild(track);
        row.appendChild(lbl);

        row.onclick = () => {
            const newVal = !track.classList.contains('on');
            track.classList.toggle('on', newVal);
            onChange(newVal);
        };

        return row;
    }

    function renderInfoSection(section, proj) {
