<script id="phototrace-domain">
'use strict';
// 1. Pure business model. Progress and statuses are derived, never authoritative stored fields.

  }
  const project = (name, date = '') => ({id:uid('project'),name,date:normalizeDate(date),rating:0,imported:false,selectionComplete:false,peopleConfirmed:false,rosterPrepared:false,suspended:false,quantities:{original:null,remaining:null,selected:null,exported:null},resources:{ipad:false,pixcake:false},storage:{original:'',working:'',delivery:'',cloudBackup:false,longTerm:false},location:'',equipment:'',tags:{location:[],equipment:[]},notes:''});
  const person = (name, groupName = '') => ({id:uid('person'),name,note:groupName});
  const task = (projectId, personId, groupId = null) => ({id:uid('task'),projectId,personId,groupId,retouched:false,published:false,excluded:false,links:[],notes:''});
  const isObject = o => o !== null && typeof o === 'object' && !Array.isArray(o);

    for(const key of ['location','equipment']) {
      const options=previous[key], aliases=new Map(options.map(s=>[tagKey(s),s]));
      p.tags[key]=uniqueTags(tags[key]).map(s=>aliases.get(tagKey(s))||s);
      validateTags(p.tags[key],key); p[key]=p.tags[key].join('、');

    return p;
  }
  function quantityErrors(q) {

    const labels = {original:'原片总数',remaining:'待筛选数',selected:'初筛入选数',exported:'精修导出数'};

  function validate(data) {

      if(p.tags!==undefined){object(p.tags,'项目标签');for(const key of ['location','equipment'])validateTags(p.tags[key],'项目标签 '+key);}
      object(p.resources,'资源'); for (const key of ['ipad','pixcake']) boolean(p.resources[key],'资源 ' + key);
      object(p.storage,'存储信息'); for (const key of ['original','working','delivery']) string(p.storage[key],'存储位置'); for (const key of ['cloudBackup','longTerm']) boolean(p.storage[key],'存储标记');
      for (const key of ['location','equipment','notes']) string(p[key],'项目 ' + key);
    }
    for (const g of data.groups) { if (!maps.projects.has(g.projectId)) fail('团体关联了不存在的项目：' + g.id); string(g.name,'团体名称',true); rating(g.rating,'团体评级'); }
    for (const p of data.people) { string(p.name,'人物名称',true); string(p.note,'人物团体'); }
    const pairs = new Set();
    for (const t of data.tasks) {
      const p = maps.projects.get(t.projectId); if (!p || !maps.people.has(t.personId)) fail('人物任务关联断裂：' + t.id);

      const pair = JSON.stringify([t.projectId,t.personId]); if (pairs.has(pair)) fail('同一项目与人物存在重复任务：' + t.id); pairs.add(pair);

      await submitForm(()=>{
        const d=C.clone(repo.data),p=id?d.projects.find(p=>p.id===id):C.project('');
        for(const key of ['name','notes'])p[key]=String(fields.get(key)).trim();
        p.date=C.normalizeDate(fields.get('date'));
        p.rating=Number(fields.get('rating'));
        if(!id)d.projects.push(p);
        C.setProjectTags(d,p,{location:readDraftTags(form,'location'),equipment:readDraftTags(form,'equipment')});
        if(id)return {candidate:d};
        for(const key of ['ipad','pixcake'])p.resources[key]=fields.has(key);p.suspended=fields.has('suspended');
        for(const key of ['original','working','delivery'])p.storage[key]=String(fields.get('storage-'+key)||'').trim();
        for(const key of ['cloudBackup','longTerm'])p.storage[key]=fields.has(key);
        return C.editQuantities(d,p.id,readQuantities(fields),false,String(fields.get('stage')));
      },{success:id?'拍摄资料已保存':'拍摄已建立，数量与当前状态已保存'});return;
    }
    if(form.id==='inline-quantity-form') {rememberQuantityDraft(form);await submitForm(()=>{const p=repo.data.projects.find(p=>p.id===id);return C.editQuantities(repo.data,id,readQuantities(fields),p.imported,String(fields.get('stage')));},{close:false,onSaved:()=>state.quantityDrafts.delete(id),success:'数量与当前阶段已保存'});return; }
    if(form.id==='roster-form') { await submitForm(()=>{const d=C.clone(repo.data);for(const person of state.rosterPeople||[])if(!d.people.some(p=>p.id===person.id))d.people.push(person);const entries=Array.from($('#roster').querySelectorAll('.roster-item')).filter(el=>el.querySelector('input[type=checkbox]').checked).map(el=>({personId:el.dataset.person,groupId:el.querySelector('[data-roster-group]').dataset.groupId||null,groupName:el.querySelector('[data-roster-group]').value,excluded:el.dataset.excluded==='true'}));return C.saveRoster(d,id,entries);},{success:'人物名单已保存'}); if(!state.modal)state.rosterPeople=[];return; }
    if(form.id==='storage-form') {await submitForm(()=>{const d=C.clone(repo.data),p=d.projects.find(p=>p.id===id);for(const key of ['original','working','delivery'])p.storage[key]=String(fields.get(key)).trim();for(const key of ['cloudBackup','longTerm'])p.storage[key]=fields.has(key);return {candidate:d};});return;}
    if(form.id==='task-form') {await submitForm(()=>{const d=C.clone(repo.data),t=d.tasks.find(t=>t.id===id);if(!d.projects.find(p=>p.id===t.projectId).selectionComplete)throw new Error('重新初筛期间暂停人物编辑');t.links=String(fields.get('links')).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);t.notes=String(fields.get('notes'));return {candidate:d};});return;}
    if(form.matches('.person-manager')) {const ok=await submitForm(()=>{const d=C.clone(repo.data),p=d.people.find(p=>p.id===id);p.name=String(fields.get('name')).trim();C.setPersonGroup(d,id,String(fields.get('groupName')||'').trim());return {candidate:d};},{close:false});if(ok)peopleManager();}
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Enter'&&(event.target.id==='detail-quick-name'||event.target.id==='detail-quick-group')){event.preventDefault();$('[data-action="detail-add-person"]')?.click();return;}
    if(event.key==='Enter'&&(event.target.id==='quick-person-name'||event.target.id==='quick-person-group')){event.preventDefault();$('[data-action="quick-add-person"]')?.click();return;}
    if(event.key==='Enter'&&event.target.matches('[data-tag-input]')){event.preventDefault();addDraftTag(event.target.dataset.tagInput);return;}
    if(event.key==='Escape') {if(state.rosterAdding){$('#confirm-layer').hidden=true;$('#confirm-layer').innerHTML='';$('#dialog-layer').inert=false;state.rosterAdding=false;}else if(state.confirm)resolveConfirmation(false);else if(state.modal)closeDialog();else if(state.detail)closeDetail();event.preventDefault();return;}
    if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-project],[data-person-card]')) {openDetail(event.target.dataset.project||event.target.dataset.personCard,event.target,event.target.dataset.personCard?'person':'project');event.preventDefault();}
    if(event.key==='Tab'&&(state.detail||state.modal||state.confirm||state.rosterAdding)) {const root=state.confirm||state.rosterAdding?$('#confirm-layer'):state.modal?$('#dialog-layer'):$('#detail-panel');const focusable=Array.from(root.querySelectorAll('button,input,select,textarea,a[href],summary,[tabindex="0"]')).filter(el=>!el.disabled&&!el.closest('[hidden]')&&el.getClientRects().length);const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){last?.focus();event.preventDefault();}else if(!event.shiftKey&&document.activeElement===last){first?.focus();event.preventDefault();}}
  });
  window.addEventListener('beforeunload',event=>{if(repo.pending||state.quantityDrafts.size||state.modal&&state.modal!=='people'&&state.modal!=='restore'){event.preventDefault();event.returnValue='';}});
  render();
})();
</script>
